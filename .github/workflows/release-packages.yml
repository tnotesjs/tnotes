# 发布 npm 包（kb / ui / ssg / mindmap-core）到 registry.npmjs.org
#
# 为什么需要它：包一直是手工发布的，结果出现过「仓库改了一堆、版本号没动、npm 上还是
# 09-11 的 tarball」——KB 站点因此拿不到修复。这个工作流把「打 tag」与「发版」绑在一起：
# 版本号必须先进 package.json，再打同名 tag，CI 校验一致后发布。
#
# 用法：
#   1) 改 packages/<pkg>/package.json 的 version（以及 CHANGELOG/说明性提交）
#   2) git tag kb@0.5.3 && git push origin kb@0.5.3
#   ui / ssg / mindmap-core 同理。
#
# 顺序要求：`@tnotesjs/ssg` 依赖 kb 与 ui（`workspace:^` 在发布时会被改写成实际范围），
# 所以升级依赖链路时先发 kb/ui，再发 ssg。
#
# 认证：**OIDC trusted publishing，没有任何长期 token**。npm 侧需为每个包配一次
# trusted publisher（Package → Settings → Trusted Publisher）：
#   Provider: GitHub Actions / Organization: tnotesjs / Repository: tnotes
#   Workflow filename: release-packages.yml / Environment: 留空
#   Allowed actions: 必须勾上 "Allow npm publish"
# 因此本工作流需要 `id-token: write`，也**不需要** NPM_TOKEN secret。

name: Release Packages

on:
  push:
    tags:
      - 'kb@*'
      - 'ui@*'
      - 'ssg@*'
      - 'mindmap-core@*'

permissions:
  contents: read
  # 申请 OIDC 身份令牌，npm 用它校验「这个工作流有权发布这个包」
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve package from tag
        id: target
        run: |
          case "${GITHUB_REF_NAME}" in
            kb@*) dir=kb; pkg='@tnotesjs/kb' ;;
            ui@*) dir=ui; pkg='@tnotesjs/ui' ;;
            ssg@*) dir=ssg; pkg='@tnotesjs/ssg' ;;
            mindmap-core@*) dir=mindmap-core; pkg='@tnotesjs/mindmap-core' ;;
            *) echo "::error::无法从 tag 解析包名：${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "pkg=${pkg}" >> "$GITHUB_OUTPUT"
          echo "expected=${GITHUB_REF_NAME#*@}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          actual=$(node -p "require('./packages/${{ steps.target.outputs.dir }}/package.json').version")
          expected='${{ steps.target.outputs.expected }}'
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag 是 ${expected}，但 packages/${{ steps.target.outputs.dir }}/package.json 是 ${actual}——先改版本号再打 tag"
            exit 1
          fi
          echo "版本一致：${{ steps.target.outputs.pkg }}@${actual}"

      # OIDC trusted publishing 需要 npm >= 11.5.1，而 Node 22 自带 npm 10.x——
      # 旧版 CLI 不认识 OIDC，会直接报 ENEEDAUTH「需要登录」。
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先构建被依赖的 workspace 包：ssg 的 dts 构建要读 `@tnotesjs/kb` 的
      # `dist/*.d.ts`，ui 要读 mindmap-core 的——干净检出里没有 dist，只构建目标包
      # 会在 dts 阶段报 `Cannot find module '@tnotesjs/kb'`。
      # （desk 的发布工作流一直有这一步 `desk^...`，这条漏了。）
      - name: Build workspace dependencies
        run: pnpm --filter '${{ steps.target.outputs.pkg }}^...' --if-present run build

      # 发布门禁：各包自己声明的 lint + test + typecheck + build（发布物就是这里产出的
      # dist/）。必须显式跑一次——后面的 `npm publish` 发生在工作区外的临时目录，不会
      # 触发包里的 `prepublishOnly`（那条脚本是给手工 `pnpm publish` 用的）。
      - name: Release gate (lint, test, typecheck, build)
        run: pnpm --filter '${{ steps.target.outputs.pkg }}' run prepublishOnly

      # 为什么要两段式：包用 `workspace:^` 消费同仓依赖，只有 pnpm 会把它重写成
      # 实际版本范围（`npm publish` 不重写，会把字面量 `workspace:^` 发出去——0.3.0
      # 那次坏发布就是这么来的）。而 provenance 与 OIDC 由 npm 支持。所以先用
      # pnpm pack 产出**已重写**的 tarball，解包到工作区外的干净目录，再用 npm 发布。
      # 解包这一步同时保证了 node_modules 不可能被带进 tarball。
      - name: Stage publish artifact (pnpm rewrites workspace protocol)
        id: stage
        run: |
          set -euo pipefail
          PKG_DIR="packages/${{ steps.target.outputs.dir }}"
          STAGE="$(mktemp -d)"
          TARBALL="$(cd "$PKG_DIR" && pnpm pack --pack-destination "$STAGE" | tail -n 1)"
          echo "packed: $TARBALL"
          mkdir -p "$STAGE/publish"
          tar -xzf "$TARBALL" -C "$STAGE/publish"
          PUBLISH_DIR="$STAGE/publish/package"
          # 让这次发布带上 provenance（可验证地链回本 commit 与工作流）
          node -e "const fs=require('fs');const f='$PUBLISH_DIR/package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.publishConfig={...(p.publishConfig||{}),provenance:true};fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "dir=$PUBLISH_DIR" >> "$GITHUB_OUTPUT"
          # 自证：不能有 workspace: 泄漏（这正是 0.3.0 坏发布的形式）
          if node -e "const p=require('$PUBLISH_DIR/package.json');const all={...p.dependencies,...p.devDependencies};process.exit(Object.values(all).some(v=>String(v).includes('workspace:'))?1:0)"; then
            echo "依赖范围已重写，无 workspace: 泄漏"
          else
            echo "::error::发布物里仍有 workspace: 依赖——pnpm pack 没有重写，拒绝发布"
            exit 1
          fi

      # 只有打 tag 的那一个包会发；凭据由 GitHub OIDC 在发布时换取，无需任何 secret
      - name: Publish (OIDC)
        working-directory: ${{ steps.stage.outputs.dir }}
        run: npm publish --access public
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Verify on the registry
        run: |
          expected='${{ steps.target.outputs.expected }}'
          actual=$(npm view '${{ steps.target.outputs.pkg }}@'"$expected" version --registry=https://registry.npmjs.org/ || true)
          if [ "$actual" != "$expected" ]; then
            echo "::error::发布后校验失败：registry 上没查到 ${{ steps.target.outputs.pkg }}@${expected}"
            exit 1
          fi
          echo "已在 registry 上确认：${{ steps.target.outputs.pkg }}@${expected}"
