packages:
  - 'packages/*'
  - 'apps/*'

# 依赖构建脚本白名单（pnpm 11 allowBuilds；对齐各老仓原有配置，其余一律阻止）
# 注意：esbuild 不能进白名单——其 postinstall 会用 Mach-O 二进制覆盖 bin/esbuild 的
# JS shim，而 pnpm 的 .bin 包装器固定用 node 加载它，导致 nav 的 esbuild CLI 报
# SyntaxError。esbuild 不跑 postinstall 也能经 optionalDependencies 正常工作。
allowBuilds:
  esbuild: false
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  '@vscode/vsce-sign': true
  keytar: true
  sharp: true
  node-pty: true

# 本组织包刚发布就要能被装到，跳过 minimumReleaseAge 冷却
minimumReleaseAgeExclude:
  - '@tnotesjs/ui'
  - '@tnotesjs/kb'
  - '@tnotesjs/ssg'
  - '@tnotesjs/mindmap-core'

# 钉死 @electron/get：app-builder-lib 26.15.3 需要 3.1.0 的 ElectronDownloadCacheMode，
# 但 pnpm 11.10.0 全新解析会选出 3.0.0（老 desk 仓 lockfile 里是 3.1.0）
overrides:
  '@electron/get@^2.0.0': 2.0.3
  '@electron/get@^3.0.0': 3.1.0
  # remark-stringify 11 声明 mdast-util-to-markdown ^2.0.0，pnpm 全新解析会选出
  # 2.0.0（没有 compilePattern），而 mdast-util-math 3 声明 ^2.1.0 并要求序列化
  # state 上存在 state.compilePattern。两份并存时旧版构造的 state 缺该方法，序列化
  # 行内公式（$...$）会抛 "state.compilePattern is not a function" 并中断编辑器创建。
  # 统一到 2.1.0（仍在 ^2.0.0 范围内，兼容）。
  'mdast-util-to-markdown@^2.0.0': 2.1.0
  # @cursor/sdk 声明 zod ^3.25.0，pnpm 全新解析会选出 3.25.0：这个版本装下来只有
  # src、没有 dist，SDK 在主进程里 import 时报 Cannot find module .../zod/dist/esm/index.js。
  'zod@^3.25.0': 3.25.76

patchedDependencies:
  '@milkdown/ctx@7.22.1': patches/@milkdown__ctx@7.22.1.patch
